[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "level-charting"
version = "0.1.0"
description = "Evidence-backed price-area maps with model-assisted selection and deterministic chart rendering"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "exchange-calendars>=4.11,<5",
  "matplotlib>=3.9,<4",
  "pydantic>=2.11,<3",
]

[project.scripts]
level-charting = "level_charting.cli:main"

[project.urls]
Repository = "https://github.com/ulrimi/level-charting"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/level_charting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
